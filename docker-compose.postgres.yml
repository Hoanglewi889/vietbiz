# Synthetic local development only. Requires an explicitly supplied password.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vietbiz
      POSTGRES_USER: vietbiz
      POSTGRES_PASSWORD: ${VIETBIZ_DB_PASSWORD:?Set VIETBIZ_DB_PASSWORD}
    volumes:
      - vietbiz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietbiz -d vietbiz"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build: ./services/api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      VIETBIZ_DATABASE_URL: postgresql+psycopg://vietbiz:${VIETBIZ_DB_PASSWORD}@postgres:5432/vietbiz
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ./services/api
    ports: ["127.0.0.1:8000:8000"]
    environment:
      VIETBIZ_ENV: development
      VIETBIZ_AUTH_MODE: demo
      VIETBIZ_DATA_DIR: /data
      VIETBIZ_DATABASE_URL: postgresql+psycopg://vietbiz:${VIETBIZ_DB_PASSWORD}@postgres:5432/vietbiz
    volumes: ["vietbiz_pg_files:/data"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  vietbiz_pg_data:
  vietbiz_pg_files:
