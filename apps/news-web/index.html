<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VietBiz • Tin tức Séc</title><style>body{margin:0;background:#f8f8f5;color:#202522;font:16px system-ui,Arial}main{max-width:850px;margin:auto;padding:35px 20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:36px;letter-spacing:-1.5px;margin:8px 0 4px}p{line-height:1.6;color:#627169}button{border:1px solid #b9c7c0;border-radius:20px;padding:10px 15px;background:white;cursor:pointer;margin:5px 5px 5px 0}button.active{background:#234c40;color:white}article{background:white;border:1px solid #e2e6e1;padding:22px;border-radius:18px;margin:15px 0}article h2{font-size:21px}a{color:#16644e}small{color:#69796e}.empty{margin-top:35px;background:#edf2ee;padding:25px;border-radius:18px}</style></head><body><main><header><strong>VIETBIZ / NEWS</strong><small>Tiếng Việt • Česká republika</small></header><h1>Tin Séc, dễ hiểu hơn.</h1><p>Tin từ báo Séc, Việt Nam và quốc tế, được biên tập viên viết lại bằng tiếng Việt và dẫn link tới mọi bài gốc. Không phải dịch toàn bài.</p><nav id="filters"></nav><section id="feed"><div class="empty">Đang tải bản tin…</div></section></main><script>
const api=new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:8000';let cat='';const labels={general:'Tổng hợp',business:'Kinh doanh',law:'Luật & Thuế',events:'Sự kiện'};const filters=document.getElementById('filters'),feed=document.getElementById('feed');function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el}function renderFilters(){filters.replaceChildren();for(const [key,label] of [['','Tất cả'],...Object.entries(labels)]){const btn=element('button',label);btn.className=cat===key?'active':'';btn.onclick=()=>{cat=key;renderFilters();load()};filters.append(btn)}}async function load(){feed.replaceChildren(element('div','Đang cập nhật…'));try{const url=api+'/v1/news'+(cat?'?category='+encodeURIComponent(cat):'');const r=await fetch(url);if(!r.ok)throw Error('API lỗi '+r.status);const items=await r.json();feed.replaceChildren();if(!items.length){const e=element('div','Chưa có bản tin tiếng Việt nào được kiểm duyệt và xuất bản.');e.className='empty';feed.append(e);return;}for(const n of items){const a=document.createElement('article');a.append(element('small',(labels[n.category]||'Tin tức')+' • '+(n.source_name||n.source_id)));a.append(element('h2',n.vi_title));a.append(element('p',n.vi_summary));const cite=element('p','Nguồn: ');cite.className='sources';const sources=(n.sources&&n.sources.length)?n.sources:[{name:n.source_name||n.source_id,url:n.url}];sources.forEach((s,i)=>{if(i)cite.append(' · ');const link=element('a',s.name);link.href=s.url;link.target='_blank';link.rel='noopener noreferrer';cite.append(link)});a.append(cite);feed.append(a)}}catch(e){feed.replaceChildren(element('div','Chưa kết nối được API. Khởi động FastAPI tại http://127.0.0.1:8000 rồi tải lại trang.'))}}renderFilters();load();
</script></body></html>
