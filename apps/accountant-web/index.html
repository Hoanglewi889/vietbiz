<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VietBiz · Công việc kế toán</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="i18n.js" defer></script>
    <script src="app.js" defer></script>
    <script src="invoices.js" defer></script>
    <script src="legal.js" defer></script>
    <script src="portfolio.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#workspace" data-i18n="skip">Đến nội dung chính</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="VietBiz"
        ><span class="brand-mark">V</span>vietbiz<span class="brand-dot"
          >.</span
        ></a
      ><span class="top-caption" data-i18n="product"></span
      ><label class="language"
        ><span data-i18n="language"></span
        ><select id="language">
          <option value="vi">Tiếng Việt</option>
          <option value="cs">Čeština</option>
        </select></label
      >
    </header>
    <div class="demo-banner">
      <span class="dot"></span><span data-i18n="demoNotice"></span
      ><span class="sprint">SPRINT 10</span>
    </div>
    <main id="workspace">
      <section class="intro">
        <div>
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <h1 data-i18n="headline"></h1>
          <p class="muted" data-i18n="subhead"></p>
        </div>
        <button id="demo" class="primary" data-i18n="demo"></button>
      </section>
      <section class="connection panel" aria-label="Connection">
        <details class="advanced-connection">
          <summary data-i18n="advanced"></summary>
          <form id="connect-form">
            <label
              ><span data-i18n="api"></span
              ><input
                id="api"
                type="url"
                required
                value="http://127.0.0.1:8000" /></label
            ><label
              ><span data-i18n="identity"></span
              ><input id="user" autocomplete="off" required /></label
            ><button
              type="submit"
              class="secondary"
              data-i18n="connect"
            ></button>
          </form>
        </details>
        <div class="context">
          <label id="demo-role-label" hidden
            ><span data-i18n="demoRole"></span
            ><select id="demo-role"></select></label
          ><label class="company"
            ><span data-i18n="company"></span
            ><select id="org" disabled>
              <option
                value=""
                data-i18n="chooseCompany"
              ></option></select></label
          ><span id="role-badge" class="badge neutral"></span>
        </div>
      </section>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <section class="metrics" aria-label="Summary">
        <div class="metric">
          <span data-i18n="active"></span><strong id="metric-active">—</strong
          ><small data-i18n="activeHint"></small>
        </div>
        <div class="metric">
          <span data-i18n="waiting"></span><strong id="metric-waiting">—</strong
          ><small data-i18n="waitingHint"></small>
        </div>
        <div class="metric">
          <span data-i18n="overdue"></span><strong id="metric-overdue">—</strong
          ><small data-i18n="overdueHint"></small>
        </div>
        <div class="metric">
          <span data-i18n="complete"></span><strong id="metric-done">—</strong
          ><small data-i18n="completeHint"></small>
        </div>
      </section>
      <div class="workspace-tabs">
        <button id="portfolio-tab" class="tab" hidden data-i18n="portfolioTab"></button
        ><button id="tasks-tab" class="tab active" data-i18n="tasks"></button
        ><button id="docs-tab" class="tab" data-i18n="documents"></button
        ><button id="cash-tab" class="tab" hidden data-i18n="cashbook"></button
        ><button id="legal-tab" class="tab" data-i18n="legalTab"></button
        ><button
          id="invoices-tab"
          class="tab"
          hidden
          data-i18n="invoicesTab"
        ></button
        ><span class="tab-note" data-i18n="scopeNote"></span>
      </div>
      <section id="tasks-view">
        <div class="task-layout">
          <section class="panel task-list-panel">
            <div class="section-heading">
              <h2 data-i18n="taskList"></h2>
              <button
                id="new-task"
                class="secondary"
                disabled
                data-i18n="newTask"
              ></button>
            </div>
            <div class="filters">
              <label
                ><span class="sr-only" data-i18n="filter"></span
                ><select id="status-filter">
                  <option
                    value=""
                    data-i18n="allStatuses"
                  ></option></select></label
              ><label class="check"
                ><input id="overdue-filter" type="checkbox" /><span
                  data-i18n="onlyOverdue"
                ></span></label
              ><button
                id="refresh"
                class="icon-button"
                data-i18n="refresh"
              ></button>
            </div>
            <div id="task-list" class="task-list" aria-live="polite"></div>
            <button
              id="more-tasks"
              class="more"
              hidden
              data-i18n="more"
            ></button>
          </section>
          <section
            class="panel detail-panel"
            id="detail-panel"
            aria-live="polite"
          ></section>
        </div>
      </section>
      <section id="docs-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="documents"></h2>
            <p class="muted" data-i18n="documentHint"></p>
          </div>
        </div>
        <form id="upload-form">
          <label
            ><span data-i18n="chooseFile"></span
            ><input
              id="upload-file"
              type="file"
              accept="application/pdf,image/png,image/jpeg"
              required /></label
          ><button
            id="upload-button"
            class="primary"
            disabled
            data-i18n="upload"
          ></button>
        </form>
        <form id="archive-filters" class="archive-filters" hidden>
          <label
            ><span data-i18n="archiveSearch"></span
            ><input
              id="f-q"
              type="search"
              maxlength="100"
              autocomplete="off"
          /></label>
          <label
            ><span data-i18n="month"></span><input id="f-month" type="month"
          /></label>
          <label
            ><span data-i18n="category"></span><select id="f-category"></select
          ></label>
          <label
            ><span data-i18n="status"></span><select id="f-status"></select
          ></label>
          <button
            type="button"
            id="f-clear"
            class="icon-button"
            data-i18n="clearFilters"
          ></button>
        </form>
        <p id="archive-summary" class="archive-summary" aria-live="polite" hidden></p>
        <div id="document-list" class="document-list"></div>
      </section>
      <section id="cash-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="cashbook"></h2>
            <p class="muted" data-i18n="cashbookHint"></p>
          </div>
          <label class="cash-month"
            ><span data-i18n="month"></span><input id="cash-month" type="month"
          /></label>
        </div>
        <div id="cash-report" class="cash-report" aria-live="polite"></div>
        <form id="cash-form" class="cash-form" novalidate>
          <label
            ><span data-i18n="cashKind"></span
            ><select id="c-kind">
              <option value="expense" data-i18n="expense"></option>
              <option value="income" data-i18n="income"></option></select
          ></label>
          <label
            ><span data-i18n="cashDate"></span><input id="c-date" type="date"
          /></label>
          <label
            ><span data-i18n="amount"></span
            ><input id="c-amount" inputmode="decimal" autocomplete="off"
          /></label>
          <label
            ><span data-i18n="currency"></span
            ><select id="c-currency">
              <option value="CZK">CZK</option>
              <option value="EUR">EUR</option></select
          ></label>
          <label
            ><span data-i18n="method"></span><select id="c-method"></select
          ></label>
          <label
            ><span data-i18n="category"></span><select id="c-category"></select
          ></label>
          <label
            ><span data-i18n="counterparty"></span
            ><input id="c-counterparty" maxlength="200" autocomplete="off"
          /></label>
          <label class="wide"
            ><span data-i18n="note"></span
            ><input id="c-description" maxlength="500" autocomplete="off"
          /></label>
          <p id="c-linked" class="muted small wide" hidden></p>
          <p id="cash-error" class="inline-error wide" role="alert"></p>
          <button
            id="cash-submit"
            class="primary"
            type="submit"
            data-i18n="addEntry"
          ></button>
        </form>
        <div id="cash-list" class="cash-list"></div>
      </section>
      <section id="invoices-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="invoicesTab"></h2>
            <p class="muted" data-i18n="invoicesHint"></p>
          </div>
          <button
            id="new-invoice"
            class="primary"
            type="button"
            data-i18n="newInvoice"
          ></button>
        </div>
        <details id="billing-details" class="billing-details">
          <summary data-i18n="sellerProfile"></summary>
          <form id="billing-form" class="invoice-grid" novalidate>
            <label class="wide"
              ><span data-i18n="legalName"></span
              ><input id="b-legal_name" maxlength="200" autocomplete="off"
            /></label>
            <label class="wide"
              ><span data-i18n="sellerAddress"></span
              ><input id="b-address" maxlength="300" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="ico"></span
              ><input id="b-ico" inputmode="numeric" maxlength="8" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="dic"></span
              ><input id="b-dic" maxlength="14" autocomplete="off"
            /></label>
            <label class="check wide"
              ><input id="b-vat_payer" type="checkbox" /><span
                data-i18n="vatPayer"
              ></span
            ></label>
            <label class="wide"
              ><span data-i18n="iban"></span
              ><input id="b-iban" maxlength="42" autocomplete="off"
            /></label>
            <label class="wide"
              ><span data-i18n="registerNote"></span
              ><input id="b-register_note" maxlength="200" autocomplete="off"
            /></label>
            <p id="billing-error" class="inline-error wide" role="alert"></p>
            <button
              id="billing-save"
              class="secondary"
              type="submit"
              data-i18n="saveProfile"
            ></button>
          </form>
        </details>
        <form id="invoice-form" class="invoice-form" hidden novalidate>
          <fieldset class="invoice-grid">
            <legend data-i18n="invCustomer"></legend>
            <label class="wide"
              ><span data-i18n="invCustomerName"></span
              ><input id="i-customer_name" maxlength="200" autocomplete="off"
            /></label>
            <label class="wide"
              ><span data-i18n="invCustomerAddress"></span
              ><input id="i-customer_address" maxlength="300" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="customerIco"></span
              ><input id="i-customer_ico" inputmode="numeric" maxlength="8" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="customerDic"></span
              ><input id="i-customer_dic" maxlength="14" autocomplete="off"
            /></label>
          </fieldset>
          <fieldset class="invoice-grid">
            <legend data-i18n="documentDetails"></legend>
            <label
              ><span data-i18n="issueDate"></span
              ><input id="i-issue_date" type="date"
            /></label>
            <label
              ><span data-i18n="invSupplyDate"></span
              ><input id="i-supply_date" type="date"
            /></label>
            <label
              ><span data-i18n="invDueDate"></span
              ><input id="i-due_date" type="date"
            /></label>
            <label
              ><span data-i18n="method"></span><select id="i-payment_method"></select
            ></label>
            <label class="wide"
              ><span data-i18n="note"></span
              ><input id="i-note" maxlength="500" autocomplete="off"
            /></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="invLines"></legend>
            <div id="i-lines" class="invoice-lines"></div>
            <button
              id="i-add-line"
              type="button"
              class="secondary"
              data-i18n="addItem"
            ></button>
          </fieldset>
          <div id="i-totals" class="invoice-totals" aria-live="polite"></div>
          <p id="invoice-error" class="inline-error" role="alert"></p>
          <div class="extract-actions">
            <button
              id="invoice-save"
              class="secondary"
              type="submit"
              data-i18n="saveDraft"
            ></button>
            <button
              id="invoice-issue"
              class="primary"
              type="button"
              data-i18n="issueInvoice"
            ></button>
            <button
              id="invoice-cancel"
              class="icon-button"
              type="button"
              data-i18n="close"
            ></button>
          </div>
        </form>
        <div id="invoice-list" class="invoice-list"></div>
      </section>
      <section id="portfolio-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="portfolioTab"></h2>
            <p class="muted" data-i18n="portfolioHint"></p>
          </div>
        </div>
        <div id="portfolio-list" class="portfolio-list" aria-live="polite"></div>
      </section>
      <section id="legal-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="legalTab"></h2>
            <p class="muted" data-i18n="legalHint"></p>
          </div>
        </div>
        <p class="legal-disclaimer" data-i18n="legalDisclaimer"></p>
        <div id="legal-filters" class="legal-filters" role="group"></div>
        <div id="legal-grid" class="legal-grid"></div>
        <p id="legal-checked" class="muted small"></p>
      </section>
      <footer>
        <span>VietBiz · 2026</span><span data-i18n="footer"></span>
      </footer>
    </main>
    <dialog id="create-dialog" aria-labelledby="create-title">
      <form id="create-form">
        <div class="section-heading">
          <h2 id="create-title" data-i18n="newTaskTitle"></h2>
          <button
            type="button"
            id="close-dialog"
            class="icon-button"
            data-i18n="close"
          ></button>
        </div>
        <label
          ><span data-i18n="title"></span
          ><input id="task-title" maxlength="180" required
        /></label>
        <label
          ><span data-i18n="description"></span
          ><textarea id="task-description" rows="4" maxlength="4000"></textarea>
        </label>
        <label
          ><span data-i18n="linkedDocument"></span
          ><select id="task-document">
            <option value="" data-i18n="noDocument"></option></select
        ></label>
        <div class="form-row">
          <label
            ><span data-i18n="dueDate"></span
            ><input id="task-due" type="date" /></label
          ><label
            ><span data-i18n="priority"></span
            ><select id="task-priority">
              <option value="normal" data-i18n="normal"></option>
              <option value="high" data-i18n="high"></option></select
          ></label>
        </div>
        <p class="muted" data-i18n="sharedNotice"></p>
        <p id="create-error" class="inline-error" role="alert"></p>
        <button
          id="create-submit"
          class="primary"
          type="submit"
          data-i18n="create"
        ></button>
      </form>
    </dialog>
    <dialog id="extract-dialog" class="wide" aria-labelledby="extract-title">
      <div class="section-heading">
        <div>
          <h2 id="extract-title" data-i18n="invoiceData"></h2>
          <p id="extract-file" class="muted"></p>
        </div>
        <button
          type="button"
          id="close-extract"
          class="icon-button"
          data-i18n="close"
        ></button>
      </div>
      <div class="extract-layout">
        <section class="extract-original" aria-labelledby="original-heading">
          <h3 id="original-heading" data-i18n="originalPreview"></h3>
          <div id="extract-preview" class="preview"></div>
        </section>
        <form id="extract-form" novalidate>
          <p id="x-source" class="muted source-note"></p>
          <fieldset>
            <legend data-i18n="supplier"></legend>
            <label
              ><span data-i18n="supplierName"></span
              ><input id="x-supplier_name" maxlength="200" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="vatId"></span
              ><input id="x-supplier_vat_id" maxlength="20" autocomplete="off"
            /></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="documentDetails"></legend>
            <div class="form-row">
              <label
                ><span data-i18n="documentNumber"></span
                ><input id="x-document_number" maxlength="64" autocomplete="off"
              /></label>
              <label
                ><span data-i18n="issueDate"></span
                ><input id="x-issue_date" type="date"
              /></label>
              <label
                ><span data-i18n="supplyDate"></span
                ><input id="x-supply_date" type="date"
              /></label>
            </div>
            <label
              ><span data-i18n="subject"></span
              ><input id="x-subject" maxlength="500" autocomplete="off"
            /></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="customer"></legend>
            <div class="form-row">
              <label
                ><span data-i18n="customerName"></span
                ><input id="x-customer_name" maxlength="200" autocomplete="off"
              /></label>
              <label
                ><span data-i18n="vatId"></span
                ><input id="x-customer_vat_id" maxlength="20" autocomplete="off"
              /></label>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="vatLines"></legend>
            <div id="x-lines" class="vat-lines"></div>
            <button
              type="button"
              id="x-add-line"
              class="secondary"
              data-i18n="addLine"
            ></button>
            <div class="form-row">
              <label
                ><span data-i18n="total"></span
                ><input id="x-total" inputmode="decimal" autocomplete="off"
              /></label>
              <label
                ><span data-i18n="currency"></span
                ><select id="x-currency">
                  <option value="CZK">CZK</option>
                  <option value="EUR">EUR</option>
                </select></label
              >
            </div>
            <label class="check"
              ><input id="x-exempt" type="checkbox" /><span
                data-i18n="exempt"
              ></span
            ></label>
            <label class="check"
              ><input id="x-reverse_charge" type="checkbox" /><span
                data-i18n="reverseCharge"
              ></span
            ></label>
          </fieldset>
          <p id="extract-error" class="inline-error" role="alert"></p>
          <div class="extract-actions">
            <button
              id="extract-save"
              class="primary"
              type="submit"
              data-i18n="saveData"
            ></button>
            <button
              id="extract-request-changes"
              class="secondary"
              type="button"
              data-i18n="requestChanges"
            ></button>
            <button
              id="extract-approve"
              class="secondary"
              type="button"
              data-i18n="approve"
            ></button>
          </div>
        </form>
        <section
          id="extract-check"
          class="extract-check"
          aria-live="polite"
          aria-labelledby="check-heading"
        >
          <h3 id="check-heading" data-i18n="checkTitle"></h3>
          <div id="check-body"></div>
          <p class="muted small" data-i18n="checkDisclaimer"></p>
        </section>
      </div>
    </dialog>
    <dialog id="print-dialog" class="wide" aria-labelledby="print-title">
      <div class="section-heading no-print">
        <div>
          <h2 id="print-title" data-i18n="printInvoice"></h2>
          <p class="muted" data-i18n="printNote"></p>
        </div>
        <div>
          <button
            type="button"
            id="print-now"
            class="primary"
            data-i18n="print"
          ></button>
          <button
            type="button"
            id="close-print"
            class="icon-button"
            data-i18n="close"
          ></button>
        </div>
      </div>
      <article id="invoice-print" class="invoice-paper" lang="cs"></article>
    </dialog>
  </body>
</html>
