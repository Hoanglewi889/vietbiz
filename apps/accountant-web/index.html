<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VietBiz · Công việc kế toán</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="ux-theme.css" />
    <link rel="stylesheet" href="quick-create.css" />
    <link rel="stylesheet" href="doc-flag.css" />
    <link rel="stylesheet" href="qty-stepper.css" />
    <link rel="stylesheet" href="range-calendar.css" />
    <script src="i18n.js" defer></script>
    <script src="app.js" defer></script>
    <script src="invoices.js" defer></script>
    <script src="legal.js" defer></script>
    <script src="portfolio.js" defer></script>
    <script src="suppliers.js" defer></script>
    <script src="filing.js" defer></script>
    <script src="goods.js" defer></script>
    <script src="bank.js" defer></script>
    <script src="cash-control.js" defer></script>
    <script src="staff.js" defer></script>
    <script src="quick-create.js" defer></script>
    <script src="doc-flag.js" defer></script>
    <script src="qty-stepper.js" defer></script>
    <script src="range-calendar.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#workspace" data-i18n="skip">Đến nội dung chính</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="VietBiz"
        ><span class="brand-mark">V</span>vietbiz<span class="brand-dot"
          >.</span
        ></a
      ><span class="top-caption" data-i18n="product"></span
      ><label class="language"
        ><span data-i18n="language"></span
        ><select id="language">
          <option value="vi">Tiếng Việt</option>
          <option value="cs">Čeština</option>
        </select></label
      >
    </header>
    <div class="demo-banner">
      <span class="dot"></span><span data-i18n="demoNotice"></span
      ><span class="sprint">SPRINT 10</span>
    </div>
    <main id="workspace">
      <section class="intro">
        <div>
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <h1 data-i18n="headline"></h1>
          <p class="muted" data-i18n="subhead"></p>
        </div>
        <button id="demo" class="primary" data-i18n="demo"></button>
      </section>
      <section class="connection panel" aria-label="Connection">
        <details class="advanced-connection">
          <summary data-i18n="advanced"></summary>
          <form id="connect-form">
            <label
              ><span data-i18n="api"></span
              ><input
                id="api"
                type="url"
                required
                value="http://127.0.0.1:8000" /></label
            ><label
              ><span data-i18n="identity"></span
              ><input id="user" autocomplete="off" required /></label
            ><button
              type="submit"
              class="secondary"
              data-i18n="connect"
            ></button>
          </form>
        </details>
        <div class="context">
          <label id="demo-role-label" hidden
            ><span data-i18n="demoRole"></span
            ><select id="demo-role"></select></label
          ><label class="company"
            ><span data-i18n="company"></span
            ><select id="org" disabled>
              <option
                value=""
                data-i18n="chooseCompany"
              ></option></select></label
          ><span id="role-badge" class="badge neutral"></span
          ><button id="login" type="button" class="secondary" data-i18n="login"></button
          ><button id="logout" type="button" class="secondary" hidden data-i18n="logout"></button>
        </div>
      </section>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <section class="metrics" aria-label="Summary">
        <div class="metric">
          <span data-i18n="active"></span><strong id="metric-active">—</strong
          ><small data-i18n="activeHint"></small>
        </div>
        <div class="metric">
          <span data-i18n="waiting"></span><strong id="metric-waiting">—</strong
          ><small data-i18n="waitingHint"></small>
        </div>
        <div class="metric">
          <span data-i18n="overdue"></span><strong id="metric-overdue">—</strong
          ><small data-i18n="overdueHint"></small>
        </div>
        <div class="metric">
          <span data-i18n="complete"></span><strong id="metric-done">—</strong
          ><small data-i18n="completeHint"></small>
        </div>
      </section>
      <div class="workspace-tabs">
        <button id="portfolio-tab" class="tab" hidden data-i18n="portfolioTab"></button
        ><button id="tasks-tab" class="tab active" data-i18n="tasks"></button
        ><button id="docs-tab" class="tab" data-i18n="documents"></button
        ><button id="cash-tab" class="tab" hidden data-i18n="cashbook"></button
        ><button id="bank-tab" class="tab" hidden data-i18n="bankTab"></button
        ><button id="staff-tab" class="tab" hidden data-i18n="staffTab"></button
        ><button id="legal-tab" class="tab" data-i18n="legalTab"></button
        ><button
          id="invoices-tab"
          class="tab"
          hidden
          data-i18n="invoicesTab"
        ></button
        ><span class="tab-note" data-i18n="scopeNote"></span>
      </div>
      <section id="tasks-view">
        <div class="task-layout">
          <section class="panel task-list-panel">
            <div class="section-heading">
              <h2 data-i18n="taskList"></h2>
              <button
                id="new-task"
                class="secondary"
                disabled
                data-i18n="newTask"
              ></button>
            </div>
            <div class="filters">
              <label
                ><span class="sr-only" data-i18n="filter"></span
                ><select id="status-filter">
                  <option
                    value=""
                    data-i18n="allStatuses"
                  ></option></select></label
              ><label class="check"
                ><input id="overdue-filter" type="checkbox" /><span
                  data-i18n="onlyOverdue"
                ></span></label
              ><button
                id="refresh"
                class="icon-button"
                data-i18n="refresh"
              ></button>
            </div>
            <div id="task-list" class="task-list" aria-live="polite"></div>
            <button
              id="more-tasks"
              class="more"
              hidden
              data-i18n="more"
            ></button>
          </section>
          <section
            class="panel detail-panel"
            id="detail-panel"
            aria-live="polite"
          ></section>
        </div>
      </section>
      <section id="docs-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="documents"></h2>
            <p class="muted" data-i18n="documentHint"></p>
          </div>
        </div>
        <form id="upload-form">
          <label
            ><span data-i18n="chooseFile"></span
            ><input
              id="upload-file"
              type="file"
              accept="application/pdf,image/png,image/jpeg"
              required /></label
          ><button
            id="upload-button"
            class="primary"
            disabled
            data-i18n="upload"
          ></button>
        </form>
        <form id="archive-filters" class="archive-filters" hidden>
          <label
            ><span data-i18n="archiveSearch"></span
            ><input
              id="f-q"
              type="search"
              maxlength="100"
              autocomplete="off"
          /></label>
          <label
            ><span data-i18n="month"></span><input id="f-month" type="month"
          /></label>
          <label
            ><span data-i18n="category"></span><select id="f-category"></select
          ></label>
          <label
            ><span data-i18n="status"></span><select id="f-status"></select
          ></label>
          <input id="f-from" type="hidden" />
          <input id="f-to" type="hidden" />
          <button
            type="button"
            id="f-clear"
            class="icon-button"
            data-i18n="clearFilters"
          ></button>
        </form>
        <!-- Lucian UX/UI Prompt #030 · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/#030 -->
        <div id="archive-extra" class="ux u030-bar" hidden>
          <details id="range-filter" class="u030-details">
            <summary><span data-i18n="rangeTitle"></span>: <b id="range-current"></b></summary>
            <div id="range-calendar" class="u030">
              <div class="u030-pills">
                <div class="u030-pill on"><small data-i18n="rangeFrom"></small><b class="u030-a ph"></b></div>
                <div class="u030-pill"><small data-i18n="rangeTo"></small><b class="u030-b ph"></b></div>
              </div>
              <div class="u030-top">
                <div class="u030-m" aria-live="polite"><span></span></div>
                <div class="u030-nav"><button type="button" data-step="-1"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button><button type="button" data-step="1"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button></div>
              </div>
              <div class="u030-wk" aria-hidden="true"></div>
              <div class="u030-view"></div>
              <div class="u030-foot"><span class="u030-sum" aria-live="polite"></span><button class="u030-ok" type="button" aria-disabled="true" data-i18n="rangeApply"></button></div>
            </div>
          </details>
          <button type="button" id="range-clear" class="icon-button" hidden data-i18n="rangeClear"></button>
          <label class="check"><input id="f-flagged" type="checkbox" /><span data-i18n="flagOnly"></span></label>
        </div>
        <p id="archive-summary" class="archive-summary" aria-live="polite" hidden></p>
        <section id="supplier-panel" class="supplier-panel" hidden aria-labelledby="supplier-title">
          <div class="supplier-col">
            <h3 id="supplier-title" data-i18n="suppliersTitle"></h3>
            <p class="muted small" data-i18n="autoCategoryHint"></p>
            <div id="supplier-list" class="supplier-list"></div>
          </div>
          <div class="supplier-col">
            <h3 data-i18n="categoriesTitle"></h3>
            <div id="category-bars" class="supplier-list"></div>
          </div>
        </section>
        <section id="goods-panel" class="supplier-panel" hidden aria-labelledby="goods-title">
          <div class="supplier-col">
            <div class="goods-head">
              <h3 id="goods-title" data-i18n="goodsTitle"></h3>
              <label class="goods-month"><span class="sr-only" data-i18n="goodsMonth"></span><input id="goods-month" type="month" /></label>
            </div>
            <p id="goods-summary" class="muted small" aria-live="polite"></p>
            <div id="goods-groups" class="supplier-list"></div>
          </div>
          <div class="supplier-col">
            <h3 data-i18n="goodsTopItems"></h3>
            <div id="goods-items" class="supplier-list"></div>
          </div>
        </section>
        <div id="document-list" class="document-list"></div>
      </section>
      <section id="cash-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="cashbook"></h2>
            <p class="muted" data-i18n="cashbookHint"></p>
          </div>
          <label class="cash-month"
            ><span data-i18n="month"></span><input id="cash-month" type="month"
          /></label>
        </div>
        <div id="cash-report" class="cash-report" aria-live="polite"></div>
        <section id="cash-control" class="cash-control" hidden aria-labelledby="close-title">
          <form id="close-form" class="close-form" novalidate>
            <h3 id="close-title" data-i18n="closeTitle"></h3>
            <p class="muted small" data-i18n="closeHint"></p>
            <label><span data-i18n="closeDate"></span><input id="close-date" type="date" /></label>
            <label><span data-i18n="openingFloat"></span><input id="close-opening" inputmode="decimal" autocomplete="off" /></label>
            <label><span data-i18n="countedCash"></span><input id="close-counted" inputmode="decimal" autocomplete="off" /></label>
            <label class="wide"><span data-i18n="note"></span><input id="close-note" maxlength="300" autocomplete="off" /></label>
            <p id="close-result" class="close-result wide" aria-live="polite"></p>
            <button id="close-save" class="primary" type="submit" data-i18n="closeTill"></button>
          </form>
          <div class="leak-panel">
            <h3 data-i18n="leakTitle"></h3>
            <div id="leak-summary" class="leak-summary"></div>
            <p id="leak-missing-hint" class="muted small" data-i18n="leakMissingHint"></p>
            <div id="leak-missing" class="leak-missing"></div>
            <h4 id="leak-undocumented-title"></h4>
            <ul id="leak-undocumented" class="leak-undocumented"></ul>
            <h4 data-i18n="flowTitle"></h4>
            <div id="cash-flow" class="cash-flow"></div>
            <p class="muted small" data-i18n="flowHint"></p>
          </div>
        </section>
        <form id="cash-form" class="cash-form" novalidate>
          <label
            ><span data-i18n="cashKind"></span
            ><select id="c-kind">
              <option value="expense" data-i18n="expense"></option>
              <option value="income" data-i18n="income"></option></select
          ></label>
          <label
            ><span data-i18n="cashDate"></span><input id="c-date" type="date"
          /></label>
          <label
            ><span data-i18n="amount"></span
            ><input id="c-amount" inputmode="decimal" autocomplete="off"
          /></label>
          <label
            ><span data-i18n="currency"></span
            ><select id="c-currency">
              <option value="CZK">CZK</option>
              <option value="EUR">EUR</option></select
          ></label>
          <label
            ><span data-i18n="method"></span><select id="c-method"></select
          ></label>
          <label
            ><span data-i18n="category"></span><select id="c-category"></select
          ></label>
          <label
            ><span data-i18n="counterparty"></span
            ><input id="c-counterparty" maxlength="200" autocomplete="off"
          /></label>
          <label class="wide"
            ><span data-i18n="note"></span
            ><input id="c-description" maxlength="500" autocomplete="off"
          /></label>
          <p id="c-linked" class="muted small wide" hidden></p>
          <p id="cash-error" class="inline-error wide" role="alert"></p>
          <button
            id="cash-submit"
            class="primary"
            type="submit"
            data-i18n="addEntry"
          ></button>
        </form>
        <div id="cash-list" class="cash-list"></div>
      </section>
      <section id="invoices-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="invoicesTab"></h2>
            <p class="muted" data-i18n="invoicesHint"></p>
          </div>
          <button
            id="new-invoice"
            class="primary"
            type="button"
            data-i18n="newInvoice"
          ></button>
        </div>
        <div id="vat-threshold" class="vat-threshold" hidden aria-live="polite"></div>
        <section id="reminders" class="reminders" hidden aria-labelledby="reminders-title">
          <h3 id="reminders-title" data-i18n="remindersTitle"></h3>
          <p class="muted small" data-i18n="remindersHint"></p>
          <div id="reminder-list" class="reminder-list"></div>
        </section>
        <details id="billing-details" class="billing-details">
          <summary data-i18n="sellerProfile"></summary>
          <form id="billing-form" class="invoice-grid" novalidate>
            <label class="wide"
              ><span data-i18n="legalName"></span
              ><input id="b-legal_name" maxlength="200" autocomplete="off"
            /></label>
            <label class="wide"
              ><span data-i18n="sellerAddress"></span
              ><input id="b-address" maxlength="300" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="ico"></span
              ><input id="b-ico" inputmode="numeric" maxlength="8" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="dic"></span
              ><input id="b-dic" maxlength="14" autocomplete="off"
            /></label>
            <label class="check wide"
              ><input id="b-vat_payer" type="checkbox" /><span
                data-i18n="vatPayer"
              ></span
            ></label>
            <label class="wide"
              ><span data-i18n="iban"></span
              ><input id="b-iban" maxlength="42" autocomplete="off"
            /></label>
            <label class="wide"
              ><span data-i18n="registerNote"></span
              ><input id="b-register_note" maxlength="200" autocomplete="off"
            /></label>
            <p id="billing-error" class="inline-error wide" role="alert"></p>
            <button
              id="billing-save"
              class="secondary"
              type="submit"
              data-i18n="saveProfile"
            ></button>
          </form>
        </details>
        <form id="invoice-form" class="invoice-form" hidden novalidate>
          <fieldset class="invoice-grid">
            <legend data-i18n="invCustomer"></legend>
            <label class="wide"
              ><span data-i18n="invCustomerName"></span
              ><input id="i-customer_name" maxlength="200" autocomplete="off"
            /></label>
            <label class="wide"
              ><span data-i18n="invCustomerAddress"></span
              ><input id="i-customer_address" maxlength="300" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="customerIco"></span
              ><input id="i-customer_ico" inputmode="numeric" maxlength="8" autocomplete="off"
            /></label>
            <label
              ><span data-i18n="customerDic"></span
              ><input id="i-customer_dic" maxlength="14" autocomplete="off"
            /></label>
          </fieldset>
          <fieldset class="invoice-grid">
            <legend data-i18n="documentDetails"></legend>
            <label
              ><span data-i18n="issueDate"></span
              ><input id="i-issue_date" type="date"
            /></label>
            <label
              ><span data-i18n="invSupplyDate"></span
              ><input id="i-supply_date" type="date"
            /></label>
            <label
              ><span data-i18n="invDueDate"></span
              ><input id="i-due_date" type="date"
            /></label>
            <label
              ><span data-i18n="method"></span><select id="i-payment_method"></select
            ></label>
            <label class="wide"
              ><span data-i18n="note"></span
              ><input id="i-note" maxlength="500" autocomplete="off"
            /></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="invLines"></legend>
            <div id="i-lines" class="invoice-lines"></div>
            <button
              id="i-add-line"
              type="button"
              class="secondary"
              data-i18n="addItem"
            ></button>
          </fieldset>
          <div id="i-totals" class="invoice-totals" aria-live="polite"></div>
          <p id="invoice-error" class="inline-error" role="alert"></p>
          <div class="extract-actions">
            <button
              id="invoice-save"
              class="secondary"
              type="submit"
              data-i18n="saveDraft"
            ></button>
            <button
              id="invoice-issue"
              class="primary"
              type="button"
              data-i18n="issueInvoice"
            ></button>
            <button
              id="invoice-cancel"
              class="icon-button"
              type="button"
              data-i18n="close"
            ></button>
          </div>
        </form>
        <div id="invoice-list" class="invoice-list"></div>
      </section>
      <section id="portfolio-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="portfolioTab"></h2>
            <p class="muted" data-i18n="portfolioHint"></p>
          </div>
        </div>
        <div id="portfolio-list" class="portfolio-list" aria-live="polite"></div>
        <div class="filing-grid">
          <section class="filing-calendar" aria-labelledby="deadline-heading">
            <h3 id="deadline-heading" data-i18n="deadlineHeading"></h3>
            <p class="muted" data-i18n="deadlineHint"></p>
            <p id="profiles-missing" class="profiles-missing" hidden></p>
            <div id="deadline-list" class="deadline-list" aria-live="polite"></div>
          </section>
          <form id="profile-form" class="profile-form" aria-labelledby="profile-heading">
            <h3 id="profile-heading" data-i18n="profileHeading"></h3>
            <p class="muted" data-i18n="profileHint"></p>
            <label><span data-i18n="company"></span><select id="profile-org"></select></label>
            <label><span data-i18n="legalForm"></span><select id="profile-form-legal"></select></label>
            <label><span data-i18n="industry"></span><select id="profile-industry"></select></label>
            <label><span data-i18n="vatStatusLabel"></span><select id="profile-vat"></select></label>
            <div id="profile-osvc-fields">
              <label><span data-i18n="osvcActivityLabel"></span><select id="profile-activity"></select></label>
              <label><span data-i18n="flatTaxLabel"></span><select id="profile-band"></select></label>
              <label><span data-i18n="healthInsurer"></span><input id="profile-insurer" maxlength="80" placeholder="VZP, OZP, ČPZP…" /></label>
            </div>
            <label class="check"><input id="profile-employees" type="checkbox" /><span data-i18n="hasEmployees"></span></label>
            <label class="check"><input id="profile-adviser" type="checkbox" /><span data-i18n="taxAdviser"></span></label>
            <p id="profile-status" class="muted" aria-live="polite"></p>
            <button id="profile-save" class="primary" type="submit" data-i18n="saveProfile"></button>
          </form>
        </div>
      </section>
      <section id="staff-view" class="panel" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="staffTab"></h2>
            <p class="muted" data-i18n="staffHint"></p>
          </div>
          <label class="cash-month"><span data-i18n="staffWeek"></span><input id="staff-week" type="date" /></label>
        </div>
        <div class="staff-grid">
          <div>
            <h3 data-i18n="staffPeople"></h3>
            <ul id="staff-people" class="staff-people"></ul>
            <form id="staff-form" class="staff-form" novalidate>
              <label><span data-i18n="staffName"></span><input id="staff-name" maxlength="80" autocomplete="off" /></label>
              <label><span data-i18n="staffJob"></span><input id="staff-job" maxlength="60" autocomplete="off" /></label>
              <label><span data-i18n="staffRate"></span><input id="staff-rate" inputmode="decimal" autocomplete="off" /></label>
              <label class="check"><input id="staff-minor" type="checkbox" /><span data-i18n="staffMinor"></span></label>
              <button id="staff-add" class="secondary" type="submit" data-i18n="staffAdd"></button>
            </form>
          </div>
          <div>
            <h3 data-i18n="shiftTitle"></h3>
            <form id="shift-form" class="shift-form" novalidate>
              <label><span data-i18n="staffName"></span><select id="shift-staff"></select></label>
              <label><span data-i18n="cashDate"></span><input id="shift-date" type="date" /></label>
              <label><span data-i18n="shiftStart"></span><input id="shift-start" type="time" value="09:00" /></label>
              <label><span data-i18n="shiftEnd"></span><input id="shift-end" type="time" value="17:30" /></label>
              <label><span data-i18n="shiftBreak"></span><input id="shift-break" type="number" min="0" max="600" value="30" /></label>
              <label><span data-i18n="shiftTips"></span><input id="shift-tips" inputmode="decimal" autocomplete="off" /></label>
              <button id="shift-add" class="primary" type="submit" data-i18n="shiftAdd"></button>
            </form>
          </div>
        </div>
        <h3 id="shift-period"></h3>
        <div class="goods-scroll">
          <table class="shift-table">
            <thead><tr><th data-i18n="staffName"></th><th data-i18n="shiftCount"></th><th data-i18n="shiftHours"></th><th data-i18n="labourCost"></th><th data-i18n="shiftTips"></th><th></th></tr></thead>
            <tbody id="shift-summary"></tbody>
